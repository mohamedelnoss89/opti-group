# fly.toml app configuration file generated for OptiSize Telegram Bot
# See https://fly.io/docs/reference/configuration/ for details

app = "optisize-bot"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  NODE_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"    # مهم جداً! البوت مبيفصلش
  auto_start_machines = true
  min_machines_running = 1       # يفضل machines شغالة

[vm]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/health"
  timeout = "5s"
